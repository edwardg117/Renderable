plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.147'
    id 'idea'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

repositories {
    mavenCentral()
    exclusiveContent {
        forRepository {
            maven {
                name = 'Modrinth'
                url = 'https://api.modrinth.com/maven'
            }
        }
        filter {
            includeGroup 'maven.modrinth'
        }
    }
}

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        client {
            client()
            gameDirectory = project.file('run')
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.INFO

            // -PquickPlay="New World" auto-joins the save folder run/saves/<name> at launch so classes that only
            // load in a level (LevelLightEngine, Flywheel's RenderDispatcherImpl, Sodium's chunk builder) can be
            // checked with -Dmixin.debug.export=true without a human at the keyboard.
            if (project.hasProperty('quickPlay')) {
                programArguments.addAll('--quickPlaySingleplayer', project.property('quickPlay').toString())
            }
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
    // The pack's rendering stack from the Modrinth Maven. Sodium and Create ship the real mod jar nested
    // under META-INF/jarjar, so extractNestedModJars below pulls those out for the compile classpath.
    // Named packModJars, not packMods, because the -PpackMods project property (used below and by the
    // dev client run) shadows a same-named bare identifier here and the configuration silently never gets created.
    packModJars
}

var extractNestedModJars = tasks.register('extractNestedModJars', Sync) {
    description = 'Extracts the Sodium mod jar and its libraries, and Flywheel from Create, out of their JarJar containers.'
    from(configurations.packModJars.collect { f ->
        zipTree(f).matching {
            if (f.name.startsWith('sodium')) {
                include 'META-INF/jarjar/net.caffeinemc.sodium-*.jar'
                include 'META-INF/jarjar/fabric-*.jar'
            } else {
                include 'META-INF/jarjar/flywheel-*.jar'
            }
        }
    })
    into layout.buildDirectory.dir('nested-mod-jars')
    eachFile { it.path = it.name }
    includeEmptyDirs = false
    duplicatesStrategy = DuplicatesStrategy.INCLUDE
}

var nestedModJars = fileTree(layout.buildDirectory.dir('nested-mod-jars')) {
    include '*.jar'
}.builtBy(extractNestedModJars)

dependencies {
    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testImplementation 'com.google.code.gson:gson:2.10.1'

    packModJars "maven.modrinth:sodium:${sodium_version}"
    packModJars "maven.modrinth:iris:${iris_version}"
    packModJars "maven.modrinth:create:${create_version}"

    // Third-party classes the optional mixins and compat classes reference. Never on the runtime classpath.
    compileOnly "maven.modrinth:iris:${iris_version}"
    compileOnly nestedModJars
}

// The pack's rendering stack for the dev client. Sodium's Modrinth artifact is a LIBRARY container whose
// IModFileCandidateLocator service merges it with its nested mod jar. Observed: that merge only happens for
// jars in the game's mods folder; on the Gradle classpath the two halves land in different module domains
// and Sodium's own mixins fail to resolve Workarounds$Reference. So with -PpackMods the artifacts are
// installed into run/mods the way a launcher would. Without the property the folder is emptied so a plain
// run is vanilla. prepareClientRun is wired too, so an IDE launch sees the same run/mods as the CLI.
configurations {
    packModRuntime {
        transitive = false
    }
}

dependencies {
    packModRuntime "maven.modrinth:sodium:${sodium_version}"
    packModRuntime "maven.modrinth:iris:${iris_version}"
    packModRuntime "maven.modrinth:create:${create_version}"
    packModRuntime "maven.modrinth:kotlin-for-forge:${kotlin_for_forge_version}"
    packModRuntime "maven.modrinth:create-enchantable-machinery:${enchantable_machinery_version}"
}

// A plain Sync task here would work for the -PpackMods case but not the plain-run case: Sync (like Copy)
// treats an empty source as NO-SOURCE and skips its action entirely rather than running it to clear the
// destination, so run/mods would keep whatever pack mods were installed by an earlier -PpackMods run.
// FileSystemOperations.sync(), called unconditionally from a real @TaskAction, does not have that skip.
abstract class InstallPackMods extends DefaultTask {
    @InputFiles
    abstract ConfigurableFileCollection getModFiles()

    @OutputDirectory
    abstract DirectoryProperty getModsDir()

    @Inject
    abstract FileSystemOperations getFileOperations()

    @TaskAction
    void install() {
        fileOperations.sync {
            from(modFiles)
            into(modsDir)
        }
    }
}

var installPackMods = tasks.register('installPackMods', InstallPackMods) {
    description = 'Installs the pack mods into run/mods when -PpackMods is set; empties run/mods otherwise.'
    if (project.hasProperty('packMods')) {
        modFiles.from(configurations.packModRuntime)
    }
    // -PextraMods="C:\path\one.jar;C:\path\two.jar" adds jars that are on no Maven, such as the pack's
    // Accelerated Rendering build, beside the pinned pack mods. Split on File.pathSeparator (';' on Windows,
    // ':' elsewhere) so a path may contain a colon but never break the split, and the flag still works on a
    // non-Windows checkout. Each entry must exist: modFiles is @InputFiles, which silently drops a missing
    // path rather than failing, so a typo would run the client without the mod and a javap-style check
    // against the running client would prove nothing about a build that never loaded it.
    if (project.hasProperty('extraMods')) {
        modFiles.from(project.property('extraMods').toString().split(File.pathSeparator)
                .findAll { !it.trim().isEmpty() }
                .collect { path ->
                    var f = project.file(path.trim())
                    if (!f.exists()) {
                        throw new GradleException("extraMods: no such file: ${f}")
                    }
                    f
                })
    }
    modsDir.set(layout.projectDirectory.dir('run/mods'))
}

tasks.named('runClient') {
    dependsOn installPackMods
}
tasks.named('prepareClientRun') {
    dependsOn installPackMods
}

var generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from 'src/main/templates'
    into 'build/generated/sources/modMetadata'
}

sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.named('test', Test) {
    useJUnitPlatform()
    testLogging {
        events 'passed', 'failed', 'skipped'
        exceptionFormat 'full'
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
