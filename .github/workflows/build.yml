name: build

on:
  push:
    branches: [main]
  pull_request:

# Nothing here needs to write to the repository.
permissions:
  contents: read

# A second push to the same ref makes the first run pointless.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # setup-gradle caches ~/.gradle, which includes caches/modules-2 where the Modrinth artifacts land.
      # That cache is what lets a build survive a Modrinth outage, so do not add a second cache for the
      # same path: two caches on one directory fight each other.
      - uses: gradle/actions/setup-gradle@v4

      # The extraction output is cheap to keep and saves unzipping the JarJar containers every run.
      - name: Cache the extracted mod jars
        uses: actions/cache@v4
        with:
          path: build/nested-mod-jars
          key: nested-mod-jars-${{ hashFiles('gradle.properties') }}

      # Minecraft and NeoForge come from their own servers, and Sodium, Iris and Create from
      # api.modrinth.com. A transient failure at any of them gets two more chances before failing the
      # build. Both tasks only download and unpack, so a genuine compile error never reaches this retry loop.
      - name: Resolve the third-party artifacts
        run: |
          for attempt in 1 2 3; do
            if ./gradlew extractNestedModJars createMinecraftArtifacts --no-daemon; then
              exit 0
            fi
            echo "attempt $attempt failed; retrying in 20s"
            sleep 20
          done
          echo "could not resolve the artifacts after three attempts"
          exit 1

      - name: Build
        run: ./gradlew build --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: renderable
          path: build/libs/*.jar
