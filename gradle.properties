org.gradle.jvmargs=-Xmx2G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

parchment_minecraft_version=1.21.1
parchment_mappings_version=2024.11.17

minecraft_version=1.21.1
minecraft_version_range=[1.21.1]
neo_version=21.1.220
loader_version_range=[1,)
# The slf4j-api version this NeoForge/Minecraft pair resolves on the runtime classpath (confirmed with
# `./gradlew dependencies --configuration runtimeClasspath`, which shows slf4j-api strictly constrained to
# this version). report/core use the plain slf4j API and need it on the test runtime classpath too, since
# only main's classpath gets it from the moddev plugin. Pinned here, beside neo_version, so a NeoForge bump
# is a reminder to re-check this value rather than a silent mismatch.
slf4j_version=2.0.9

mod_id=renderable
mod_name=Renderable
mod_license=MIT
mod_version=0.4.1
mod_group_id=io.github.edwardg117.renderable
mod_authors=edwardg117
mod_description=Client render profiler: shows which block entities, entities and effects cost frame time and what caused each hitch.

# Versions of the Gears & Frontiers pack's rendering stack, used by the dev client when -PpackMods is passed.
sodium_version=mc1.21.1-0.8.13-neoforge
iris_version=1.8.14-beta.1+1.21.1-neoforge
create_version=6.0.10+mc1.21.1
enchantable_machinery_version=3.6.0+mc1.21.1-neoforge
kotlin_for_forge_version=5.12.0
